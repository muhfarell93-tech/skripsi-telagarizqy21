<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradBottle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="bottleShadow">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#2D150F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#bgGradBottle)"/>
  <ellipse cx="150" cy="270" rx="55" ry="12" fill="#2D150F" opacity="0.2"/>

  <g filter="url(#bottleShadow)">
    <!-- Bottle Shape -->
    <path d="M 125 50 L 175 50 L 175 80 C 175 110, 205 125, 205 160 L 205 245 C 205 260, 195 265, 150 265 C 105 265, 95 260, 95 245 L 95 160 C 95 125, 125 110, 125 80 Z" fill="#F5F7FA"/>
    
    <!-- Bottle Specular Reflection -->
    <path d="M 125 50 L 175 50 L 175 80 C 175 110, 205 125, 205 160 L 205 245 C 205 260, 195 265, 150 265 C 105 265, 95 260, 95 245 L 95 160 C 95 125, 125 110, 125 80 Z" fill="url(#glassReflection)"/>
    <path d="M 108 150 L 108 245" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 116 160 L 116 235" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

    <!-- Cap -->
    <rect x="120" y="38" width="60" height="15" rx="5" fill="#2B6CB0"/>
    <line x1="120" y1="45" x2="180" y2="45" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>

    <!-- Paper Label Vintage Farm -->
    <rect x="110" y="160" width="80" height="75" rx="6" fill="#FDFBF7" stroke="#D8C8B8" stroke-width="1.5"/>
    <rect x="114" y="164" width="72" height="67" rx="4" fill="none" stroke="#2B6CB0" stroke-width="1" opacity="0.6"/>
    
    <!-- Label Icon (Goat / Heart) -->
    <circle cx="150" cy="180" r="10" fill="#2B6CB0" opacity="0.15"/>
    <text x="150" y="184" font-family="sans-serif" font-weight="900" font-size="10" fill="#2B6CB0" text-anchor="middle">TR</text>
    <text x="150" y="202" font-family="serif" font-weight="bold" font-size="9" fill="#2C1D18" text-anchor="middle">KEFIR MURNI</text>
    <text x="150" y="214" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#8C7A6B" text-anchor="middle">PROBIOTIK ALAMI</text>
    <text x="150" y="224" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#2B6CB0" text-anchor="middle">100% PURE GOAT MILK</text>
  </g>
</svg>
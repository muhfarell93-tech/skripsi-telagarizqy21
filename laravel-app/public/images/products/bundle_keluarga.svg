<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradKeluarga" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </radialGradient>
    <filter id="dropFam">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#2D150F" flood-opacity="0.22"/>
    </filter>
  </defs>
  <circle cx="170" cy="150" r="140" fill="url(#bgGradKeluarga)"/>
  
  <ellipse cx="120" cy="260" rx="45" ry="10" fill="#2D150F" opacity="0.16"/>
  <ellipse cx="225" cy="262" rx="50" ry="12" fill="#2D150F" opacity="0.22"/>

  <!-- Left Box 1 -->
  <g transform="translate(45, 65) scale(0.75)" filter="url(#dropFam)">
    <rect x="95" y="70" width="100" height="170" rx="8" fill="#1B3A60"/>
    <rect x="95" y="70" width="100" height="35" rx="6" fill="#0E233D"/>
    <text x="145" y="92" font-family="serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">RIZQIKU</text>
  </g>

  <!-- Left Box 2 slightly in front -->
  <g transform="translate(80, 85) scale(0.72)" filter="url(#dropFam)">
    <rect x="95" y="70" width="100" height="170" rx="8" fill="#5C2417"/>
    <rect x="95" y="70" width="100" height="35" rx="6" fill="#8C3522"/>
    <text x="145" y="92" font-family="serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">RIZQIKU</text>
  </g>

  <!-- Right Big 1L Fresh Milk Bottle -->
  <g transform="translate(145, 40) scale(0.85)" filter="url(#dropFam)">
    <path d="M 125 50 L 175 50 L 175 80 C 175 110, 205 125, 205 160 L 205 245 C 205 260, 195 265, 150 265 C 105 265, 95 260, 95 245 L 95 160 C 95 125, 125 110, 125 80 Z" fill="#FDFEFE"/>
    <rect x="120" y="38" width="60" height="15" rx="5" fill="#1B3A60"/>
    <rect x="110" y="160" width="80" height="75" rx="6" fill="#FDFBF7" stroke="#D8C8B8" stroke-width="1.5"/>
    <text x="150" y="195" font-family="serif" font-weight="bold" font-size="11" fill="#1B3A60" text-anchor="middle">SUSU MURNI</text>
    <text x="150" y="210" font-family="sans-serif" font-size="8" font-weight="bold" fill="#8C7A6B" text-anchor="middle">1000 ML (1L)</text>
    <path d="M 108 150 L 108 245" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Promo Badge -->
  <g transform="translate(170, 35)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1B3A60" filter="url(#dropFam)"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PAKET KELUARGA</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradTetra" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <filter id="tetraShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#2D150F" flood-opacity="0.18"/>
    </filter>
  </defs>
  <circle cx="150" cy="150" r="130" fill="url(#bgGradTetra)"/>
  <ellipse cx="150" cy="265" rx="55" ry="10" fill="#2D150F" opacity="0.2"/>

  <!-- Straw sticking out -->
  <path d="M 175 60 L 210 25" stroke="#E63946" stroke-width="8" stroke-linecap="round"/>
  <path d="M 175 60 L 210 25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>

  <g filter="url(#tetraShadow)">
    <!-- Box Front -->
    <rect x="105" y="70" width="90" height="175" rx="6" fill="#FFFFFF"/>
    <!-- Box Blue Curved Header -->
    <path d="M 105 76 C 105 72, 108 70, 112 70 L 188 70 C 192 70, 195 72, 195 76 L 195 125 Q 150 145 105 125 Z" fill="#2B6CB0"/>
    
    <text x="150" y="98" font-family="serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">FIT GOAT</text>
    <text x="150" y="112" font-family="sans-serif" font-weight="bold" font-size="7" fill="#EBF8FF" text-anchor="middle">SUSU KAMBING UHT</text>

    <!-- Goat Graphic / Heart -->
    <circle cx="150" cy="165" r="22" fill="#EBF8FF"/>
    <text x="150" y="171" font-family="serif" font-weight="bold" font-size="16" fill="#2B6CB0" text-anchor="middle">🐐</text>

    <text x="150" y="210" font-family="sans-serif" font-weight="900" font-size="10" fill="#2D3748" text-anchor="middle">SIAP MINUM</text>
    <text x="150" y="224" font-family="sans-serif" font-size="8" font-weight="bold" fill="#718096" text-anchor="middle">200 ML</text>
  </g>
</svg>
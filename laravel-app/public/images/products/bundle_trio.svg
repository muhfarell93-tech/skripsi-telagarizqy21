<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradBundle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </radialGradient>
    <filter id="dropTrio">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#2D150F" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="170" cy="150" r="140" fill="url(#bgGradBundle)"/>
  
  <!-- Shadows -->
  <ellipse cx="110" cy="255" rx="45" ry="10" fill="#2D150F" opacity="0.14"/>
  <ellipse cx="230" cy="255" rx="45" ry="10" fill="#2D150F" opacity="0.14"/>
  <ellipse cx="170" cy="265" rx="55" ry="12" fill="#2D150F" opacity="0.22"/>

  <!-- Left Cup (Cokelat) -->
  <g transform="translate(60, 60) scale(0.72)" filter="url(#dropTrio)">
    <path d="M 85 85 L 105 250 C 106 256, 115 260, 150 260 C 185 260, 194 256, 195 250 L 215 85 Z" fill="#4A261A"/>
    <ellipse cx="150" cy="85" rx="65" ry="12" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="150" cy="83" rx="56" ry="8" fill="#361B12"/>
    <path d="M 96 95 L 112 245" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Right Cup (Vanila) -->
  <g transform="translate(160, 60) scale(0.72)" filter="url(#dropTrio)">
    <path d="M 85 85 L 105 250 C 106 256, 115 260, 150 260 C 185 260, 194 256, 195 250 L 215 85 Z" fill="#E8D5B5"/>
    <ellipse cx="150" cy="85" rx="65" ry="12" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="150" cy="83" rx="56" ry="8" fill="#FFF5E4"/>
    <path d="M 96 95 L 112 245" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Center Front Cup (Stroberi Pink) -->
  <g transform="translate(95, 45) scale(0.85)" filter="url(#dropTrio)">
    <path d="M 85 85 L 105 250 C 106 256, 115 260, 150 260 C 185 260, 194 256, 195 250 L 215 85 Z" fill="#E86C8D"/>
    <path d="M 92 140 Q 150 160 208 140 L 200 200 Q 150 220 100 200 Z" fill="#FFC2D1" opacity="0.7"/>
    <ellipse cx="150" cy="85" rx="65" ry="12" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="150" cy="83" rx="56" ry="8" fill="#FFF0F3"/>
    <!-- Brand Heart -->
    <circle cx="150" cy="180" r="18" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 150 174 C 142 165, 130 174, 150 190 C 170 174, 158 165, 150 174 Z" fill="#8B2635"/>
    <path d="M 96 95 L 112 245" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Promo Badge -->
  <g transform="translate(170, 40)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#8B2635" filter="url(#dropTrio)"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BELI 3 HEMAT</text>
  </g>
</svg>
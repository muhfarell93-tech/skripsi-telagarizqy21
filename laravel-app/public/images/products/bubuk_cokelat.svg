<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradBox" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </radialGradient>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#2D150F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#bgGradBox)"/>
  <ellipse cx="150" cy="265" rx="65" ry="12" fill="#2D150F" opacity="0.2"/>

  <g filter="url(#boxShadow)">
    <!-- 3D Perspective Box -->
    <!-- Front Face -->
    <rect x="95" y="70" width="110" height="180" rx="8" fill="#FAF5F0"/>
    
    <!-- Top Decorative Header Band -->
    <path d="M 95 78 C 95 73, 99 70, 104 70 L 196 70 C 201 70, 205 73, 205 78 L 205 105 L 95 105 Z" fill="#542817"/>
    
    <!-- Gold / Luxury Foil Line -->
    <rect x="95" y="105" width="110" height="3" fill="#E5B25D"/>

    <!-- Brand Name -->
    <text x="150" y="90" font-family="serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">RIZQIKU</text>
    <text x="150" y="100" font-family="sans-serif" font-weight="bold" font-size="6.5" fill="#FFF2D6" text-anchor="middle" letter-spacing="0.5">SUSU KAMBING BUBUK</text>

    <!-- Center Flavor Badge -->
    <circle cx="150" cy="148" r="32" fill="#FFFFFF" stroke="#E5B25D" stroke-width="2"/>
    <circle cx="150" cy="148" r="28" fill="#542817" opacity="0.12"/>
    <text x="150" y="145" font-family="serif" font-weight="bold" font-size="10" fill="#2C1D18" text-anchor="middle">RASA</text>
    <text x="150" y="158" font-family="sans-serif" font-weight="900" font-size="11" fill="#542817" text-anchor="middle">COKELAT</text>

    <!-- Halal & Netto Badges -->
    <rect x="105" y="215" width="40" height="16" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text x="125" y="226" font-family="sans-serif" font-weight="bold" font-size="7" fill="#1B4D2E" text-anchor="middle">HALAL</text>

    <rect x="155" y="215" width="40" height="16" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text x="175" y="226" font-family="sans-serif" font-weight="bold" font-size="7" fill="#4A3B32" text-anchor="middle">250 gr</text>

    <!-- Specular Reflection -->
    <path d="M 98 75 L 105 245" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
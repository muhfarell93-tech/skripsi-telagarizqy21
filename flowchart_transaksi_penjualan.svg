<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1220" width="1200" height="1220" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <!-- Drop Shadow for publication beauty -->
    <filter id="shadow" x="-6%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Top -->
  <text x="600" y="30" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">Flowchart Penjualan</text>

  <!-- SWIMLANE OUTER BORDER & COLUMNS -->
  <!-- Outer Box -->
  <rect x="50" y="45" width="1100" height="1065" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Column Header Background -->
  <rect x="50" y="45" width="1100" height="42" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Vertical Divider Lines -->
  <line x1="390" y1="45" x2="390" y2="1110" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="770" y1="45" x2="770" y2="1110" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Column Header Texts -->
  <text x="220" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Admin</text>
  <text x="580" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Kasir</text>
  <text x="960" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Konsumen</text>

  <!-- ==================== ADMIN COLUMN (Center X = 220) ==================== -->
  
  <!-- 1. Mulai (Terminator) -->
  <rect x="160" y="105" width="120" height="40" rx="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Mulai</text>

  <!-- Arrow Mulai -> Login Admin -->
  <line x1="220" y1="145" x2="220" y2="185" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Login Ke Halaman Admin (Process) -->
  <rect x="135" y="185" width="170" height="48" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="206" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Login Ke</text>
  <text x="220" y="222" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Halaman Admin</text>

  <!-- Arrow Login Admin -> Input Management -->
  <line x1="220" y1="233" x2="220" y2="275" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Input Management Data Menu dan User (Data / Parallelogram) -->
  <polygon points="140,275 315,275 295,330 120,330" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="215" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Input Management</text>
  <text x="215" y="311" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Data Menu</text>
  <text x="215" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">dan User</text>

  <!-- Arrow Input Management connects to Kasir Login -->
  <path d="M 305 302 L 345 302 L 345 150 L 580 150 L 580 185" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>


  <!-- ==================== KONSUMEN COLUMN (Center X = 960) ==================== -->

  <!-- 1. Datang ke Telaga Rizqy 21 (Manual Input / Trapezoid) -->
  <polygon points="870,105 1050,105 1030,150 890,150" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Datang ke</text>
  <text x="960" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Telaga Rizqy 21</text>

  <!-- Arrow Datang -> Melihat katalog -->
  <line x1="960" y1="150" x2="960" y2="185" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Melihat daftar katalog (Process / Inverted Trapezoid in skripsi) -->
  <polygon points="880,185 1040,185 1020,230 900,230" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Melihat daftar</text>
  <text x="960" y="221" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">katalog</text>

  <!-- Arrow Melihat katalog -> Decision Tertarik -->
  <line x1="960" y1="230" x2="960" y2="265" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Decision Tertarik? (Diamond) -->
  <polygon points="960,265 1035,307 960,349 885,307" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="312" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Tertarik</text>

  <!-- Branch Tertarik: Tidak -> Goes Right, down to Selesai -->
  <text x="1045" y="302" font-size="11" font-weight="bold" fill="#0f172a">Tidak</text>
  <path d="M 1035 307 L 1100 307 L 1100 1060 L 1025 1060" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch Tertarik: Ya -> Down to Membayar Pesanan & Kasir Input Pesanan -->
  <text x="968" y="365" font-size="11" font-weight="bold" fill="#0f172a">Ya</text>
  
  <!-- Flow Ya ke Kasir Input Pesanan -->
  <path d="M 960 349 L 960 375 L 665 375 L 665 240 L 580 240 L 580 260" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Membayar Pesanan (Manual Operation / Inverted Trapezoid) -->
  <polygon points="885,405 1035,405 1015,448 905,448" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Membayar</text>
  <text x="960" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Pesanan</text>

  <!-- Arrow Membayar Pesanan to Kasir Input Uang -->
  <path d="M 885 426 L 685 426 L 685 470 L 660 470" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>


  <!-- ==================== KASIR COLUMN (Center X = 580) ==================== -->

  <!-- 1. Login Ke Halaman Kasir (Process) -->
  <rect x="505" y="185" width="150" height="48" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="206" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Login Ke</text>
  <text x="580" y="222" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Halaman Kasir</text>

  <!-- Arrow Login Kasir -> Input Pesanan -->
  <line x1="580" y1="233" x2="580" y2="260" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. input pesanan (Data / Parallelogram) -->
  <polygon points="515,260 660,260 640,310 495,310" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="575" y="283" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">input</text>
  <text x="575" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">pesanan</text>

  <!-- Arrow Input Pesanan -> Membayar Pesanan Konsumen -->
  <path d="M 640 285 L 730 285 L 730 426 L 885 426" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. input uang yang dibayarkan (Data / Parallelogram) -->
  <polygon points="505,445 660,445 640,498 485,498" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="468" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">input</text>
  <text x="570" y="482" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">uang yang di</text>
  <text x="570" y="495" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">bayarkan</text>

  <!-- Arrow input uang -> Decision Kembalian -->
  <line x1="570" y1="498" x2="570" y2="535" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Decision: Apakah ada kembalian? (Diamond) -->
  <polygon points="570,535 650,580 570,625 490,580" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="576" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Apakah ada</text>
  <text x="570" y="591" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">kembalian</text>

  <!-- Branch Kembalian: Ya -> Memberi Kembalian -->
  <text x="660" y="565" font-size="11" font-weight="bold" fill="#0f172a">Ya</text>
  <path d="M 650 580 L 710 580 L 710 615" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Memberi Kembalian (Kasir - Inverted Trapezoid) -->
  <polygon points="650,615 770,615 755,660 665,660" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="635" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Memberi</text>
  <text x="710" y="650" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Kembalian</text>

  <!-- Arrow Memberi Kembalian -> Konsumen Menerima Kembalian -->
  <line x1="770" y1="638" x2="880" y2="638" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Konsumen: Menerima Kembalian (Inverted Trapezoid) -->
  <polygon points="880,615 1010,615 995,660 895,660" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="635" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Menerima</text>
  <text x="945" y="650" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Kembalian</text>

  <!-- Loop back from Menerima Kembalian to Konfirmasi Pembayaran Kasir -->
  <path d="M 945 660 L 945 690 L 640 690 L 640 710 L 570 710 L 570 720" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Branch Kembalian: Tidak -> Direct Down to Konfirmasi Pembayaran -->
  <text x="578" y="655" font-size="11" font-weight="bold" fill="#0f172a">Tidak</text>
  <line x1="570" y1="625" x2="570" y2="720" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Konfirmasi Pembayaran Transaksi (Process) -->
  <rect x="480" y="720" width="180" height="52" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="743" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Konfirmasi</text>
  <text x="570" y="759" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Pembayaran</text>
  <text x="570" y="773" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Transaksi</text>

  <!-- Arrow Konfirmasi -> Struk Pembayaran Kasir -->
  <line x1="570" y1="772" x2="570" y2="810" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Struk Pembayaran Kasir (Document Shape) -->
  <path d="M 495 810 L 645 810 L 645 850 C 625 860, 605 845, 580 855 C 555 865, 520 848, 495 858 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="832" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Struk</text>
  <text x="570" y="848" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Pembayaran</text>

  <!-- Arrow Struk Kasir -> Struk Konsumen -->
  <line x1="645" y1="835" x2="880" y2="835" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Konsumen: Struk Pembayaran (Document Shape) -->
  <path d="M 885 810 L 1035 810 L 1035 850 C 1015 860, 995 845, 970 855 C 945 865, 910 848, 885 858 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="960" y="832" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Struk</text>
  <text x="960" y="848" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Pembayaran</text>

  <!-- Arrow Struk Kasir down to Memberi Produk -->
  <path d="M 570 862 L 570 895" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. Memberi Produk Yang di Pesan (Kasir - Inverted Trapezoid) -->
  <polygon points="490,895 650,895 635,948 505,948" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="915" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Memberi</text>
  <text x="570" y="930" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Produk</text>
  <text x="570" y="944" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Yang di Pesan</text>

  <!-- Arrow Memberi Produk Kasir -> Menerima Produk Konsumen -->
  <line x1="650" y1="920" x2="880" y2="920" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Konsumen: Menerima Produk Yang di Pesan (Inverted Trapezoid) -->
  <polygon points="885,895 1045,895 1030,948 900,948" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="965" y="915" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Menerima</text>
  <text x="965" y="930" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Produk</text>
  <text x="965" y="944" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Yang di Pesan</text>

  <!-- Arrow Menerima Produk -> Selesai -->
  <line x1="965" y1="948" x2="965" y2="1040" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Selesai (Terminator) -->
  <rect x="905" y="1040" width="120" height="40" rx="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="965" y="1065" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Selesai</text>


  <!-- ==================== CAPTION DI BAWAH ==================== -->
  <text x="600" y="1150" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">
    Gambar 23. Desain Flowchart (Sumber: Penulis, 2024)
  </text>
  <text x="600" y="1175" text-anchor="middle" font-size="12" fill="#475569">
    Sistem Informasi Pengolahan Data Transaksi Keuangan pada Telaga Rizqy 21
  </text>
</svg>
    <text x="10" y="68" font-size="11" fill="#334155">📄 nama_user : varchar(100)</text>
    <text x="10" y="89" font-size="11" fill="#334155">📄 username : varchar(100)</text>
    <text x="10" y="110" font-size="11" fill="#334155">📄 password : varchar(255)</text>
    <text x="10" y="131" font-size="11" fill="#334155">📄 jabatan : enum('admin','kasir')</text>
    <text x="10" y="152" font-size="11" font-weight="600" fill="#2563eb">#️⃣ id_outlet : int(11)</text>
  </g>

  <!-- 5. TB_OUTLET (Bottom-Center - Organization Hub) -->
  <g transform="translate(370, 670)" filter="url(#card-shadow)">
    <!-- Header -->
    <rect x="0" y="0" width="240" height="28" rx="5" fill="#3b82f6"/>
    <rect x="0" y="24" width="240" height="4" fill="#3b82f6"/>
    <text x="8" y="19" font-size="11" font-weight="bold" fill="#ffffff">🗄️ telagarizqy21 tb_outlet</text>
    <!-- Body -->
    <rect x="0" y="28" width="240" height="105" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Rows -->
    <text x="10" y="47" font-size="11" font-weight="bold" fill="#b45309">🔑 id_outlet : int(11)</text>
    <text x="10" y="68" font-size="11" fill="#334155">📄 nama_outlet : varchar(100)</text>
    <text x="10" y="89" font-size="11" fill="#334155">📄 no_telepon_outlet : varchar(20)</text>
    <text x="10" y="110" font-size="11" fill="#334155">📄 alamat_outlet : text</text>
  </g>

  <!-- 6. TB_TRANSAKSI (Top-Right) -->
  <g transform="translate(880, 45)" filter="url(#card-shadow)">
    <!-- Header -->
    <rect x="0" y="0" width="345" height="28" rx="5" fill="#3b82f6"/>
    <rect x="0" y="24" width="345" height="4" fill="#3b82f6"/>
    <text x="8" y="19" font-size="11" font-weight="bold" fill="#ffffff">🗄️ telagarizqy21 tb_transaksi</text>
    <!-- Body -->
    <rect x="0" y="28" width="345" height="210" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Rows -->
    <text x="10" y="47" font-size="11" font-weight="bold" fill="#b45309">🔑 id_transaksi : int(11)</text>
    <text x="10" y="68" font-size="11" fill="#334155">📄 kode_invoice : varchar(100)</text>
    <text x="10" y="89" font-size="11" fill="#334155">📄 kuantitas : int(11)</text>
    <text x="10" y="110" font-size="11" fill="#334155">📄 status_bayar : enum('belum_dibayar','sudah_dibayar')</text>
    <text x="10" y="131" font-size="11" fill="#334155">📄 tgl_transaksi : int(11)</text>
    <text x="10" y="152" font-size="11" fill="#334155">📄 keterangan : text</text>
    <text x="10" y="173" font-size="11" font-weight="600" fill="#d97706">#️⃣ id_menu : int(11)</text>
    <text x="10" y="194" font-size="11" font-weight="600" fill="#15803d">#️⃣ id_user : int(11)</text>
    <text x="10" y="215" font-size="11" font-weight="600" fill="#2563eb">#️⃣ id_outlet : int(11)</text>
  </g>

  <!-- 7. TB_LOG_PENGELUARAN (Middle-Right) -->
  <g transform="translate(880, 420)" filter="url(#card-shadow)">
    <!-- Header -->
    <rect x="0" y="0" width="240" height="28" rx="5" fill="#3b82f6"/>
    <rect x="0" y="24" width="240" height="4" fill="#3b82f6"/>
    <text x="8" y="19" font-size="11" font-weight="bold" fill="#ffffff">🗄️ telagarizqy21 tb_log_pengeluaran</text>
    <!-- Body -->
    <rect x="0" y="28" width="240" height="105" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Rows -->
    <text x="10" y="47" font-size="11" font-weight="bold" fill="#b45309">🔑 id_log_pengeluaran : int(11)</text>
    <text x="10" y="68" font-size="11" fill="#334155">📄 keterangan : text</text>
    <text x="10" y="89" font-size="11" fill="#334155">📄 tanggal : int(11)</text>
    <text x="10" y="110" font-size="11" font-weight="600" fill="#15803d">#️⃣ id_user : int(11)</text>
  </g>

  <!-- 8. TB_LOG (Bottom-Right) -->
  <g transform="translate(880, 640)" filter="url(#card-shadow)">
    <!-- Header -->
    <rect x="0" y="0" width="240" height="28" rx="5" fill="#3b82f6"/>
    <rect x="0" y="24" width="240" height="4" fill="#3b82f6"/>
    <text x="8" y="19" font-size="11" font-weight="bold" fill="#ffffff">🗄️ telagarizqy21 tb_log</text>
    <!-- Body -->
    <rect x="0" y="28" width="240" height="105" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Rows -->
    <text x="10" y="47" font-size="11" font-weight="bold" fill="#b45309">🔑 id_log : int(11)</text>
    <text x="10" y="68" font-size="11" fill="#334155">📄 isi_log : text</text>
    <text x="10" y="89" font-size="11" fill="#334155">📄 tanggal_log : int(11)</text>
    <text x="10" y="110" font-size="11" font-weight="600" fill="#15803d">#️⃣ id_user : int(11)</text>
  </g>

  <!-- ==================== CAPTION DI BAWAH ==================== -->
  <text x="640" y="930" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">
    Gambar 28. Desain Tabel Relasi (Sumber: Penulis, 2024)
  </text>
  <text x="640" y="952" text-anchor="middle" font-size="11" fill="#475569">
    Relasi Database Sistem Informasi Pengolahan Data Transaksi Keuangan Telaga Rizqy 21
  </text>
</svg>
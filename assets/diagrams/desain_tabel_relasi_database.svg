    <text x="10" y="68" font-size="11" fill="#334155">📄 nama_menu : varchar(100)</text>
    <text x="10" y="89" font-size="11" fill="#334155">📄 harga_menu : int(11)</text>
    <text x="10" y="110" font-size="11" font-weight="600" fill="#2563eb">#️⃣ id_outlet : int(11)</text>
  </g>

  <!-- 4. TB_USER (Center - Primary Hub) -->
  <g transform="translate(370, 320)" filter="url(#card-shadow)">
    <!-- Header -->
    <rect x="0" y="0" width="240" height="28" rx="5" fill="#3b82f6"/>
    <rect x="0" y="24" width="240" height="4" fill="#3b82f6"/>
    <text x="8" y="19" font-size="11" font-weight="bold" fill="#ffffff">🗄️ telagarizqy21 tb_user</text>
    <!-- Body -->
    <rect x="0" y="28" width="240" height="145" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Rows -->
